<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Cliente - BF Digital Exchange</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400,500,600,700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030712;
            --bg-card: #0f172a;
            --accent: #facc15;
            --accent-glow: rgba(250, 204, 21, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-deep); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; overflow-x: hidden; }
        
        .card { 
            background: var(--bg-card); border: 1px solid var(--border); padding: 40px; border-radius: 20px; width: 100%; max-width: 420px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); position: relative; overflow: hidden;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s ease, border-color 0.35s ease;
        }
        .card:hover { 
            transform: translateY(-6px); 
            box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 30px var(--accent-glow); 
            border-color: var(--accent); 
        }
        .card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, var(--accent), #eab308); }
        
        h2 { color: #fff; text-align: center; margin-bottom: 25px; font-size: 20px; text-transform: uppercase; letter-spacing: 1px; }
        
        .group { margin-bottom: 20px; }
        label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        input { 
            width: 100%; padding: 14px; background: var(--bg-deep); border: 1px solid var(--border); border-radius: 10px; font-size: 14px; color: #fff; outline: none; 
            transition: border-color 0.2s, box-shadow 0.2s; 
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 10px var(--accent-glow); }
        
        button { 
            width: 100%; background: var(--accent); color: #030712; border: none; padding: 15px; border-radius: 10px; font-weight: 800; cursor: pointer; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; 
            transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease; box-shadow: 0 4px 15px var(--accent-glow); margin-top: 10px; 
        }
        button:hover { opacity: 0.95; transform: translateY(-2px); box-shadow: 0 6px 20px var(--accent-glow); }
        
        .flash { color: var(--danger); background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 20px; font-size: 13px; font-weight: 600; }
        .back { display: block; text-align: center; margin-top: 20px; color: var(--text-muted); font-size: 12px; text-decoration: none; text-transform: uppercase; font-weight: 600; transition: color 0.2s; }
        .back:hover { color: var(--accent); }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔐 Aceder à Sala</h2>
        {% with messages = get_flashed_messages() %}
            {% if messages %}<div class="flash">{{ messages[0] }}</div>{% endif %}
        {% endwith %}
        <form method="POST">
            <div class="group"><label>Email</label><input type="email" name="email" required placeholder="exemplo@gmail.com"></div>
            <div class="group"><label>Palavra-passe</label><input type="password" name="password" required placeholder="••••••••"></div>
            <button type="submit">Entrar</button>
        </form>
        <a href="/" class="back">← Voltar ao Início</a>
    </div>
</body>
</html>
