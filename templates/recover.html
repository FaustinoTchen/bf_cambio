<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Conta - BF Digital Exchange</title>
    <style>
        :root {
            --primary: #0f172a;
            --secondary: #1e3a8a;
            --accent: #2563eb;
            --light: #f8fafc;
            --text: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--light); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        .recover-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 30px; width: 100%; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .recover-card h2 { font-size: 20px; color: var(--primary); margin-bottom: 15px; text-align: center; }
        .recover-card p { font-size: 13px; color: #64748b; margin-bottom: 20px; text-align: center; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 14px; }
        
        .btn { display: block; width: 100%; background: var(--accent); color: #fff; padding: 12px; border: none; border-radius: 5px; font-size: 15px; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; transition: background 0.2s; }
        .btn:hover { background: #1d4ed8; }
        
        .back-link { display: block; text-align: center; margin-top: 15px; font-size: 13px; color: var(--accent); text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="recover-card">
        <h2>Recuperar Conta</h2>
        <p>Insira os seus dados de registo e defina uma nova palavra-passe secreta.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div style="margin-bottom: 15px;">
                    {% for category, message in messages %}
                        <div style="padding: 10px; background: #fee2e2; color: #dc2626; border-radius: 5px; font-size: 13px;">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="/recover" method="POST">
            <div class="form-group">
                <label>E-mail Cadastrado</label>
                <input type="email" name="email" required placeholder="exemplo@gmail.com">
            </div>
            <div class="form-group">
                <label>Número de Telefone</label>
                <input type="text" name="telefone" required placeholder="+244 9XX XXX XXX">
            </div>
            <div class="form-group">
                <label>Nova Palavra-passe Secreta</label>
                <input type="password" name="nova_password" required placeholder="Nova password">
            </div>
            <button type="submit" class="btn">Recuperar Palavra-passe</button>
        </form>

        <a href="/" class="back-link">&larr; Voltar à Página Inicial</a>
    </div>

</body>
</html>
