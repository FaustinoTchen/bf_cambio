<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Conta - BF Digital Exchange</title>
    <style>
        :root {
            --bg-deep: #030712;
            --bg-card: #0f172a;
            --accent: #facc15;
            --accent-glow: rgba(250, 204, 21, 0.15);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-deep); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .recover-card { background: var(--bg-card); border: 1px solid var(--border); padding: 40px; border-radius: 20px; width: 100%; max-width: 420px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); position: relative; overflow: hidden; }
        .recover-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; background: linear-gradient(90deg, var(--accent), #eab308); }
        
        .recover-card h2 { font-size: 20px; color: #fff; margin-bottom: 10px; text-align: center; text-transform: uppercase; letter-spacing: 1px; }
        .recover-card p { font-size: 13px; color: var(--text-muted); margin-bottom: 25px; text-align: center; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 11px; font-weight: 700; margin-bottom: 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input { width: 100%; padding: 14px; background: var(--bg-deep); border: 1px solid var(--border); border-radius: 10px; font-size: 14px; color: #fff; outline: none; transition: border-color 0.2s; }
        .form-group input:focus { border-color: var(--accent); }
        
        .btn { display: block; width: 100%; background: var(--accent); color: #030712; padding: 15px; border: none; border-radius: 10px; font-size: 14px; font-weight: 800; cursor: pointer; text-align: center; text-decoration: none; text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 4px 15px var(--accent-glow); transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        
        .back-link { display: block; text-align: center; margin-top: 20px; font-size: 12px; color: var(--text-muted); text-decoration: none; text-transform: uppercase; font-weight: 600; transition: color 0.2s; }
        .back-link:hover { color: var(--accent); }
    </style>
</head>
<body>

    <div class="recover-card">
        <h2>Recuperar Conta</h2>
        <p>Insira os seus dados de registo e defina uma nova palavra-passe secreta.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div style="margin-bottom: 20px;">
                    {% for category, message in messages %}
                        <div style="padding: 12px; background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 8px; font-size: 13px; font-weight: 600; text-align: center;">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form action="/recover" method="POST">
            <div class="form-group">
                <label>E-mail Cadastrado</label>
                <input type="email" name="email" required placeholder="exemplo@gmail.com">
            </div>
            <div class="form-group">
                <label>Número de Telefone</label>
                <input type="text" name="telefone" required placeholder="+244 9XX XXX XXX">
            </div>
            <div class="form-group">
                <label>Nova Palavra-passe Secreta</label>
                <input type="password" name="nova_password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn">Atualizar Palavra-passe</button>
        </form>

        <a href="/" class="back-link">&larr; Voltar à Página Inicial</a>
    </div>

</body>
</html>
